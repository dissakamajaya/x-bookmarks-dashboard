<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Bookmarks Dashboard</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <div class="bar-left">
          <span class="mark">✦</span>
          <h1>exp-research reading queue</h1>
          <span id="liveDot" class="dot"></span>
        </div>
        <div class="bar-right">
          <div class="search-wrap">
            <input id="filterInput" type="search" placeholder="Search text, author, handle…" autocomplete="off" />
          </div>
          <button id="refreshBtn" class="btn primary">↻ Refresh</button>
          <div class="settings-wrap">
            <button id="settingsBtn" class="btn icon-btn" title="Settings">⚙</button>
            <div id="settingsMenu" class="settings-menu hidden">
              <div class="menu-item">
                <span>Account</span>
                <strong id="accountValue">—</strong>
              </div>
              <div class="menu-item">
                <span>Loaded</span>
                <strong id="countValue">0</strong>
              </div>
              <div class="menu-item">
                <span>New</span>
                <strong id="newValue">0</strong>
              </div>
              <div class="menu-item">
                <span>Source</span>
                <strong id="sourceValue">—</strong>
              </div>
              <div class="menu-item">
                <span>Status</span>
                <strong id="statusValue">—</strong>
              </div>
              <div class="menu-divider"></div>
              <div class="menu-item">
                <span>Last refresh</span>
                <strong id="refreshValue">—</strong>
              </div>
              <div class="menu-divider"></div>
              <div class="menu-item">
                <span>Refresh interval</span>
                    <select id="intervalSelect" class="menu-select">
                      <option value="0">Manual only</option>
                      <option value="15000">15s</option>
                      <option value="30000" selected>30s</option>
                      <option value="60000">60s</option>
                      <option value="120000">2m</option>
                      <option value="300000">5m</option>
                    </select>
                  </div>
                  <div class="menu-divider"></div>
                  <div class="menu-item" style="flex-direction:column;align-items:stretch;gap:6px">
                    <span style="font-size:11px;color:var(--muted)">X API tokens</span>
                    <input id="tokenInput" type="password" placeholder="Access token (:at:)" style="flex:1;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none" />
                    <input id="refreshTokenInput" type="password" placeholder="Refresh token (:rt:) for auto-refresh" style="flex:1;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none" />
                    <button id="saveTokenBtn" class="btn" style="height:auto;padding:6px 12px;font-size:12px">Save</button>
                    <span id="tokenStatus" style="font-size:11px;color:var(--muted)"></span>
                  </div>
            </div>
          </div>
        </div>
      </header>

      <div id="setupBanner" class="banner hidden" aria-live="polite"></div>

      <section id="feed" class="feed" aria-live="polite"></section>
    </div>

    <template id="tweetTemplate">
      <article class="tweet-card">
        <div class="new-marker hidden">N</div>
        <header class="tweet-header">
          <img class="avatar" alt="" />
          <div>
            <div class="author-line">
              <strong class="author-name"></strong>
              <span class="handle"></span>
            </div>
            <div class="tweet-meta">
              <time class="time"></time>
              <span class="dot-sep">·</span>
              <span class="age"></span>
            </div>
          </div>
          <a class="x-link" target="_blank" rel="noreferrer">↗</a>
        </header>
        <p class="text"></p>
        <div class="tags"></div>
        <div class="media"></div>
        <footer class="footer">
          <div class="metrics"></div>
        </footer>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
